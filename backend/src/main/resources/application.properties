spring.application.name=backend
server.servlet.context-path=/backend
server.servlet.session.timeout=30m
server.servlet.session.cookie.name=MYAPP_SESSION
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.path=/backend
app.environment=${APP_ENV:test}
app.sso-url=${SSO_URL:https://abc.sso.com/}
app.frontend-url=${FRONTEND_URL:/frontend/}
app.validation-url=${TOKEN_VALIDATION_URL:}
app.permissions-url=${PERMISSIONS_URL:}
